name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      placeholder: |
        1. Selected Carousel and pasted a long article
        2. Selected the Paper style
        3. Selected Save all slides, and the last slide was empty
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Quotical version
      description: At the top left of the window, beside the name Quotical
      placeholder: e.g. 1.6.0
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 26.1, Ubuntu 24.04
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or a screen recording help a lot. You can drag them in here.
